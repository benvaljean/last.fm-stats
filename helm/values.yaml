replicaCount: 1

image:
  repository: benvaljean/musicstats
  tag: "0.8.4"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  tls: []
  # Example:
  # - secretName: musicstats-tls
  #   hosts:
  #     - musicstats.domain.example

database:
  name: musicstatslive
  user: musicstats
  # This name is deliberately stable because the MySQL dependency receives its
  # values before parent chart templates are rendered.
  credentialsSecretName: musicstats-db-credentials
  password: ""

resources: {}

importer:
  enabled: true
  # Kubernetes CronJob schedule, in the controller's timezone.
  schedule: "0 3 * * *"
  image:
    repository: benvaljean/musicstats-import
    tag: "0.1.1"
    pullPolicy: IfNotPresent
  # Last.fm usernames are public; the database password remains in the Secret.
  lastfmUser: ""
  # Used only when playsimport is empty. Set this to limit an initial backfill.
  initialFromEpoch: "0"
  resources: {}

mysql:
  architecture: standalone
  image:
    registry: docker.io
    repository: bitnamilegacy/mysql
    tag: 9.4.0-debian-12-r1
  auth:
    database: musicstatslive
    username: musicstats
    # key "mysql-password" for the musicstats user
    # key "mysql-root-password" for root
    # key "MUSICSTATS_DB_PASSWORD" for the musicstats user
    existingSecret: musicstats-db-credentials
  primary:
    # Required by importscrobbles.sql, which uses LOAD DATA LOCAL INFILE.
    extraFlags: "--local-infile=1"
    persistence:
      enabled: true
      # k3s ships with this local-path provisioner by default.
      storageClass: local-path
      size: 128Mi
