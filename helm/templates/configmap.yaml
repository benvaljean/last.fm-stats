apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "musicstats.fullname" . }}
  labels:
    {{- include "musicstats.labels" . | nindent 4 }}
data:
  MUSICSTATS_DB_HOST: {{ printf "%s-mysql" .Release.Name | quote }}
  MUSICSTATS_DB_PORT: "3306"
  MUSICSTATS_DB_NAME: {{ .Values.database.name | quote }}
  MUSICSTATS_DB_USER: {{ .Values.database.user | quote }}
